name: Simulink CI

on:
  push:
    branches: [main]
    paths-ignore:
      - build/codegen/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Run buildtool
    runs-on: ubuntu-latest
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_BATCH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: >
            MATLAB
            Simulink
            MATLAB_Coder
            Simulink_Coder

      - name: Run default build task
        uses: matlab-actions/run-build@v2

      - name: Commit generated code
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A build/codegen
          if git diff --cached --quiet; then
            echo "No generated code changes to commit."
          else
            git commit -m "Update generated Simulink code [skip ci]"
            git push
          fi
